[project]
name = "freecad-mcp-pro"
version = "0.1.19"
description = "FreeCAD MCP server for AI assistants - control FreeCAD via opencode, Claude Desktop, or any MCP client"
readme = "README.md"
authors = [
    { name = "GadatheGod", email = "praveen@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.12.2",
    "validators>=0.34.0",
]

[project.scripts]
freecad-mcp-pro = "freecad_mcp.server:main"

[tool.hatch.build.targets.sdist]
exclude = ["assets", "results"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
